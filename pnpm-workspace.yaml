packages:
  - apps/*
  - packages/*

# Expo SDK 58 stable owns the React / RN / Metro compatibility matrix.
# Keep these overrides aligned with the SDK 58 template instead of forcing
# upstream "latest" versions that Expo has not validated together.
overrides:
  lightningcss: 1.30.1
  react: 19.3.0
  react-dom: 19.3.0
  "@expo/dom-webview": 58.0.2

# @reactvision/react-viro is vendored at vendor/reactvision-react-viro-3.0.2-moyo.1.tgz:
# an npm pack of the mikevocalz/viro fork pinned at commit 5393d00744f4. The
# fork is a private repo, so a git/tarball URL would fail in CI without
# credentials. Regenerate with: npm pack the pinned checkout (dist/ is
# committed upstream, so no build step is needed). Its peer range covers Expo
# 58 and React Native 0.88. apps/mobile/scripts/assert-viro-fork.mjs still
# guards native commands against a resolution that drifts back to npm.
# Known, accepted peer warnings (pnpm 12.8.1 ignored the packageExtensions that
# used to sit here: removing them left the resolved graph unchanged, so they
# were dropped on 2026-10-04).
# - @rive-app/react-native@0.5.5 (npm latest, 2026-10-16) still declares
#   react-native-nitro-modules <0.37. This starter intentionally stays on
#   Nitro 0.37.x (also npm latest).

allowBuilds:
  # false: the vendored tarball ships the fork's committed dist/; there is no
  # build to run. Bump the tarball together with the catalog pin.
  "@reactvision/react-viro@file:vendor/reactvision-react-viro-3.0.2-moyo.1.tgz": false
  # kinetrell ships source for git consumers; its `prepare` runs tsdown to
  # emit dist/ (the exports map only resolves against built files).
  "kinetrell@https://codeload.github.com/mikevocalz/Kinetrell/tar.gz/344de51531ce050c4311d3feb70e4d596bdc8041": true
  sharp: true
  unrs-resolver: true
  esbuild: true
  # ffmpeg-static's install script downloads the ffmpeg binary for the build
  # host (Render is linux-x64). The NVIDIA companion's /api/tts pitch shift
  # runs it; Render's native Node runtime has no ffmpeg of its own.
  ffmpeg-static: true
  # protobufjs's postinstall only prints a version warning; @grpc/proto-loader
  # needs no build output from it.
  protobufjs: false

# Expo SDK 58 packages were published together. Keep pnpm's 24-hour
# release-age protection for the rest of the graph while allowing the explicitly
# selected Expo 58 family to install immediately.
minimumReleaseAgeExclude:
  - '@shopify/*'
  # Skia v3 and its Graphite binary packages (3.6.1 published 2026-10-15).
  - react-native-skia
  - 'react-native-skia-*'
  - 'canvaskit-wasm'
  - '@expo/*'
  - '@rive-app/*'
  - '@reactvision/*'
  - 'react-native-webgpu'
  - 'react-native-audio-api'
  - expo
  - 'expo-*'
  - babel-preset-expo
  - eslint-config-expo
  - eslint-plugin-expo@1.2.1
  # Taken fresh on purpose (published <24h before the 2026-10-04 upgrade).
  # Taken fresh on purpose in the 2026-10-16 upgrade ("most recent on npm").
  - lucide-react@1.58.0
  - lucide-react-native@1.58.0
  - next@16.4.2
  - '@next/*'
  - eslint-config-next@16.4.2
  - '@anthropic-ai/sdk@0.135.0'
  - vitest@5.0.5
  - '@vitest/*'
  - lenis@1.3.27
  - '@tanstack/*'
  - react-native-svg@15.16.0
  - "@payloadcms/db-postgres@4.0.0-beta.6"
  - "@payloadcms/drizzle@4.0.0-beta.6"
  - "@payloadcms/graphql@4.0.0-beta.6"
  - "@payloadcms/plugin-mcp@4.0.0-beta.6"
  - "@payloadcms/tanstack-start@4.0.0-beta.6"
  - "@payloadcms/translations@4.0.0-beta.6"
  - "@payloadcms/ui@4.0.0-beta.6"
  - payload@4.0.0-beta.6
  - three@0.187.0

# One version per dependency, declared once. Package manifests consume catalog:.
catalog:
  # Expo SDK 58 stable / React Native 0.88 lane
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-web: 0.21.4
  expo: 58.0.14
  "@expo/env": 2.5.2
  "@expo/metro-runtime": 58.0.14
  expo-asset: 58.0.16
  expo-constants: 58.0.13
  "@expo/dom-webview": 58.0.2
  expo-font: 58.0.8
  expo-file-system: 58.0.9
  expo-haptics: 58.0.6
  expo-image: 58.0.15
  expo-document-picker: 58.0.4
  expo-image-picker: 58.0.10
  # Additional native permission modules on the final onboarding screen.
  expo-audio: 58.0.9
  expo-location: 58.0.17
  expo-sensors: 58.0.4
  expo-calendar: 58.0.6
  expo-notifications: 58.1.5
  # M21 offline banner and sync screen: the connectivity source.
  expo-network: 58.0.4
  expo-glass-effect: 58.0.4
  expo-symbols: 58.0.4
  "@expo/material-symbols": 0.1.1
  expo-linking: 58.0.14
  # M03 Sign in with Apple (native sheet) and Google (in-app browser, PKCE).
  expo-apple-authentication: 58.0.2
  expo-auth-session: 58.0.15
  expo-crypto: 58.0.7
  expo-web-browser: 58.0.7
  expo-router: 58.0.23
  expo-splash-screen: 58.0.10
  expo-status-bar: 58.0.3
  expo-system-ui: 58.0.6
  expo-build-properties: 58.0.11
  # apps/mobile/babel.config.js names this preset, so the app must declare it;
  # the Gradle JS bundle step resolves it from the app, not through expo.
  babel-preset-expo: 58.0.17
  # Pinned 2026-10-15: the floating audio-api-nightly tag moved to 1.0.0-nightly-eb17d84-20261015, whose Android C++ does not compile (AndroidAudioPlayer constructor). Bump by exact version after a device build.
  react-native-audio-api: 1.0.0-nightly-8588c31-20261007
  react-native-youtube-bridge: 2.2.3
  react-native-keyboard-controller: 1.22.7
  react-native-mmkv: 4.3.2
  react-native-nitro-modules: 0.37.1
  react-native-nitro-fetch: 1.9.0
  react-native-enriched-html: 1.1.1
  react-native-gesture-handler: ~3.3.0
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: ~5.10.1
  react-native-screens: ~4.30.0
  react-native-worklets: 0.13.0
  # Required (non-optional) peer of react-native-worklets; declared so pnpm
  # does not auto-install npm `latest` (0.87.x) against RN 0.88.
  "@react-native/metro-config": 0.88.0
  "@react-navigation/native": 7.5.1
  solito: 5.0.0
  lucide-react: 1.58.0
  lucide-react-native: 1.58.0
  react-native-svg: 15.16.0
  react-native-pulsar: 1.7.0
  "@expo/html-elements": 58.0.3
  "@expo/ui": 58.0.20
  expo-paste-input: 0.2.2
  expo-drag-drop-content-view: 0.9.2

  # universal GPU graphics
  # Skia v3 (Graphite by default; Android minSdk 26+). One package under two
  # names: react-native-graph imports @shopify/react-native-skia, our code
  # imports react-native-skia, and both resolve to the same 3.6.1 install.
  react-native-skia: 3.6.1
  "@shopify/react-native-skia": npm:react-native-skia@3.6.1
  react-native-graph: 1.4.0
  # Exact match for react-native-skia 3.6.1's own dependency (npm latest is
  # 0.42.0; a second copy would pair skia's web glue with a different wasm).
  canvaskit-wasm: 0.41.1
  react-native-webgpu: 0.16.0
  typegpu: 0.12.7
  # three.js on its WebGPU renderer (WebGL2 backend as the web fallback),
  # with TypeGPU functions bridged into TSL by @typegpu/three.
  three: 0.187.0
  "@typegpu/three": 0.12.1
  "@typegpu/gl": 0.12.6

  # spatial / XR / Rive
  "@reactvision/react-viro": file:vendor/reactvision-react-viro-3.0.2-moyo.1.tgz
  "@reactvision/viro-web-renderer": 1.0.1
  "@metavr/layout-compat": 1.0.0
  "@metavr/layout-window-compat": 1.0.0
  "@rive-app/react-native": 0.5.5
  "@rive-app/react-webgl2": 4.36.0

  # web
  "@next/env": 16.4.2
  next: 16.4.2
  nextjs-toploader: 3.9.17

  # cinematic web motion — Kinetrell is the one abstraction over GSAP,
  # ScrollTrigger and Lenis (do not add a second animation library).
  # Pinned to the known-good git commit; bump the SHA to upgrade.
  kinetrell: github:mikevocalz/Kinetrell#344de51531ce050c4311d3feb70e4d596bdc8041
  # Kinetrell's peer set for the web adapters (kinetrell/web/*).
  gsap: 3.15.0
  "@gsap/react": 2.1.2
  lenis: 1.3.27

  # styling
  uniwind: 1.12.2
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  react-native-css: 3.0.7
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1

  # state / data
  "@tanstack/react-query": 5.104.3
  "@tanstack/react-virtual": 3.14.21
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-pacer": 0.24.1
  "@tanstack/react-table": 9.3.1
  "@legendapp/list": 3.6.0
  "@legendapp/motion": 2.5.3
  date-fns: 4.4.0
  zustand: 5.0.15
  zod: 4.6.7
  # Audio2Face-3D over gRPC from the web-sim's /api/tts (hosted NVCF function).
  "@grpc/grpc-js": 1.14.6
  "@grpc/proto-loader": 0.8.1
  ws: 8.22.0
  # Static ffmpeg for the companion's stage pitch shift on hosts without one (Render).
  ffmpeg-static: 5.3.0
  "@types/ws": 8.18.2

  # auth (ADR 0001; DECISIONS #2, #3)
  # @delmaredigital/payload-better-auth 0.40.0-next.0 ships upstream Payload 4
  # support (PR delmaredigital/payload-better-auth#43), replacing the mikevocalz
  # fork pin. The patchedDependencies entry below re-applies the fork's two
  # adapter fixes upstream has not shipped: Payload APIError translation
  # (escaping errors answered `200 500`) and the jwkss double-s slug fix.
  "@delmaredigital/payload-better-auth": 0.40.0-next.0
  better-auth: 1.7.10
  "@better-auth/passkey": 1.7.10
  # OAuth 2.1 authorization server for Alexa+ account linking (ADR 0016).
  "@better-auth/oauth-provider": 1.7.10
  resend: 6.33.0
  "@aws-sdk/client-sns": 3.1152.0

  # backend / cms
  # On 4.0.0-beta.6. From canary.38 on, payload dropped the public
  # createLocalReq export (now createPayloadRequest), renamed FileData.sizes to
  # variants, and removed the `sharp` config key (image sizes move to
  # @payloadcms/transformer-sharp). Bump the family together.
  payload: 4.0.0-beta.6
  "@payloadcms/db-postgres": 4.0.0-beta.6
  "@payloadcms/next": 4.0.0-beta.6
  "@payloadcms/ui": 4.0.0-beta.6
  # Exposes mon-models to MCP clients (Claude Code, Claude Desktop) at /payload-api/mcp.
  "@payloadcms/plugin-mcp": 4.0.0-beta.6
  # The admin runs on TanStack Start in apps/admin-vite (docs/adr/0003).
  # The adapter peers vite >=8, @vitejs/plugin-react ^6, @vitejs/plugin-rsc
  # ^0.5.21, @tanstack/react-start ^1.168.26 and the exact payload version.
  "@payloadcms/tanstack-start": 4.0.0-beta.6
  "@tanstack/react-start": 1.169.2
  # Exact match for @tanstack/react-start 1.169.2's own dependency.
  "@tanstack/react-router": 1.170.44
  "@vitejs/plugin-rsc": 0.5.38
  # Emits Vercel Build Output API v3 for apps/admin-vite (preset: 'vercel').
  nitro: 3.0.260903-beta
  # waitUntil() for Better Auth's background tasks (mail) outside Next.
  "@vercel/functions": 3.10.1
  # Held on 16.x: payload / @payloadcms/* 4.0.0 peer graphql ^16.8.1
  # (npm latest is 17.0.2).
  graphql: 16.14.2
  pg: 8.23.1
  sharp: 0.35.5
  "@types/pg": 8.23.1

  # storybook / vite
  storybook: 10.6.2
  "@storybook/react-vite": 10.6.2
  "@storybook/addon-a11y": 10.6.2
  "@vitejs/plugin-react": ^6.1.2
  vite: ^8.3.4
  vite-plugin-react-native-web: ^3.2.0
  sonner: 2.0.8
  sonner-native: 0.27.0

  # mcp (ADR 0005; docs/alexa/PLATFORM-DOCS.md §3.4). The v2 split packages;
  # @modelcontextprotocol/sdk 1.x is the legacy monolith. jose verifies the
  # authorization server's JWT access tokens against its JWKS.
  "@modelcontextprotocol/server": 2.3.1
  "@modelcontextprotocol/node": 2.1.1
  "@modelcontextprotocol/client": 2.3.1
  jose: 6.2.12

  # web simulator (packages/web-sim, ADR 0017). ext-apps hosts MCP Apps views;
  # the Bedrock SDK's Mantle client calls Claude on Amazon Bedrock server-side.
  "@modelcontextprotocol/ext-apps": 2.0.3
  "@anthropic-ai/sdk": 0.135.0
  "@anthropic-ai/bedrock-sdk": 0.35.0

  # tooling
  # Held on 6.0.x: typescript-eslint 8 (via eslint-config-expo/-next) peers
  # typescript <6.1.0 (npm latest is 7.0.2).
  typescript: ~6.0.3
  "@types/react": ~19.3.0
  "@types/node": ^26.6.5
  "@types/react-dom": ^19.3.0
  "@webgpu/types": 0.1.74
  "@types/three": 0.186.0
  unplugin-typegpu: 0.12.5
  # Held on 9.x: eslint-config-expo 58 pulls eslint-plugin-react 7 and
  # eslint-plugin-import, which peer eslint <=9 (npm latest is 10.12.0).
  eslint: ^9.39.5
  eslint-config-expo: ~58.0.4
  eslint-config-next: 16.4.2
  "@eslint/eslintrc": ^3.3.7
  babel-plugin-react-compiler: 1.0.0
  turbo: 2.11.8
  vitest: 5.0.5
  react-native-arrangement-view: 0.4.0

patchedDependencies:
  '@better-auth/core@1.7.10': patches/@better-auth__core@1.7.10.patch
  '@delmaredigital/payload-better-auth@0.40.0-next.0': patches/@delmaredigital__payload-better-auth@0.40.0-next.0.patch
  '@reactvision/react-viro': patches/@reactvision__react-viro.patch
  '@rive-app/react-native@0.5.5': patches/@rive-app__react-native@0.5.5.patch
  better-call@1.4.2: patches/better-call@1.4.2.patch
  metro@0.87.1: patches/metro@0.87.1.patch
  react-native-enriched-html@1.1.1: patches/react-native-enriched-html@1.1.1.patch
  react-native-graph@1.4.0: patches/react-native-graph@1.4.0.patch
  react-native-nitro-fetch@1.9.0: patches/react-native-nitro-fetch@1.9.0.patch
  react-native-skia@3.6.1: patches/react-native-skia@3.6.1.patch
  react-native-webgpu@0.16.0: patches/react-native-webgpu@0.16.0.patch
  react-native-worklets@0.13.0: patches/react-native-worklets@0.13.0.patch
  three@0.187.0: patches/three@0.187.0.patch
