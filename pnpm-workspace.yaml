  "@types/react": ~19.3.0
  "@types/node": ^26.6.4
  "@types/react-dom": ^19.3.0
  "@webgpu/types": 0.1.74
  unplugin-typegpu: 0.12.4
  eslint: ^9.39.5
  eslint-config-expo: ~58.0.4
  eslint-config-next: 16.3.8
  "@eslint/eslintrc": ^3.3.7
  babel-plugin-react-compiler: 1.0.0
  turbo: 2.11.7
