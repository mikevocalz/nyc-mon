  zod: 4.6.5

  # backend / cms
  payload: 4.0.0-canary.37
  "@payloadcms/db-postgres": 4.0.0-canary.37
  "@payloadcms/next": 4.0.0-canary.37
  "@payloadcms/ui": 4.0.0-canary.37
  graphql: 16.14.2
  pg: 8.23.1
  sharp: 0.35.5
  "@types/pg": 8.23.1

  # storybook / vite
  storybook: 10.6.1
  "@storybook/react-vite": 10.6.1
  "@storybook/addon-a11y": 10.6.1
  "@vitejs/plugin-react": ^6.1.1
  vite: ^8.3.2
  vite-plugin-react-native-web: ^3.2.0
  sonner: 2.0.8
  sonner-native: 0.27.0

  # tooling
