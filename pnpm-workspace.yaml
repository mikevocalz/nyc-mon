packages:
  - apps/*
  - packages/*

# Expo SDK 58 stable owns the React / RN / Metro compatibility matrix.
# Keep these overrides aligned with the SDK 58 template instead of forcing
# upstream "latest" versions that Expo has not validated together.
overrides:
  lightningcss: 1.30.1
  react: 19.3.0
  react-dom: 19.3.0
  "@expo/dom-webview": 58.0.2

# @reactvision/react-viro comes from the mikevocalz/viro fork, pinned to a
# merge commit on its main branch (catalog below). The fork commits its built
# dist/, so pnpm installs it without running its build scripts. Its peer range
# covers Expo 58 and React Native 0.88. apps/mobile/scripts/assert-viro-fork.mjs
# still guards native commands against a resolution that drifts back to npm.
# Known, accepted peer warnings (pnpm 12.8.1 ignored the packageExtensions that
# used to sit here: removing them left the resolved graph unchanged, so they
# were dropped on 2026-10-04).
# - @rive-app/react-native@0.5.2 (npm latest) declares
#   react-native-nitro-modules <0.37. This starter intentionally stays on
#   Nitro 0.37.x (also npm latest).

allowBuilds:
  # false: install the fork's committed dist/ without running its prepare
  # (tsc). pnpm refuses an unlisted git dependency that has build scripts.
  # Bump the commit here together with the catalog pin.
  "@reactvision/react-viro@git+https://github.com/mikevocalz/viro.git#5393d00744f448fc462ef13ee76b1346fc47512e": false
  sharp: true
  unrs-resolver: true
  esbuild: true

# Expo SDK 58 packages were published together. Keep pnpm's 24-hour
# release-age protection for the rest of the graph while allowing the explicitly
# selected Expo 58 family to install immediately.
minimumReleaseAgeExclude:
  - '@shopify/*'
  # Skia v3 and its Graphite binary packages (3.0.2 published 2026-10-03).
  - react-native-skia
  - 'react-native-skia-*'
  - 'canvaskit-wasm'
  - '@expo/*'
  - '@rive-app/*'
  - '@reactvision/*'
  - 'react-native-webgpu'
  - 'react-native-audio-api'
  - expo
  - 'expo-*'
  - babel-preset-expo
  - eslint-config-expo
  - eslint-plugin-expo@1.2.1
  # Taken fresh on purpose (published <24h before the 2026-10-04 upgrade).
  - lucide-react@1.51.0
  - lucide-react-native@1.51.0

# One version per dependency, declared once. Package manifests consume catalog:.
catalog:
  # Expo SDK 58 stable / React Native 0.88 lane
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0-rc.3
  react-native-web: 0.21.3
  expo: 58.0.3
  "@expo/env": 2.5.1
  "@expo/metro-runtime": 58.0.11
  expo-asset: 58.0.11
  expo-constants: 58.0.9
  "@expo/dom-webview": 58.0.2
  expo-font: 58.0.6
  expo-file-system: 58.0.5
  expo-haptics: 58.0.4
  expo-image: 58.0.11
  expo-document-picker: 58.0.4
  expo-image-picker: 58.0.10
  expo-glass-effect: 58.0.3
  expo-symbols: 58.0.4
  "@expo/material-symbols": 0.1.1
  expo-linking: 58.0.10
  expo-router: 58.0.13
  expo-splash-screen: 58.0.5
  expo-status-bar: 58.0.3
  expo-system-ui: 58.0.5
  expo-build-properties: 58.0.10
  # apps/mobile/babel.config.js names this preset, so the app must declare it;
  # the Gradle JS bundle step resolves it from the app, not through expo.
  babel-preset-expo: 58.0.9
  react-native-audio-api: audio-api-nightly
  react-native-youtube-bridge: 2.2.3
  react-native-keyboard-controller: 1.22.4
  react-native-mmkv: 4.3.2
  react-native-nitro-modules: 0.37.1
  react-native-enriched-html: 1.1.1
  react-native-gesture-handler: ~3.2.1
  react-native-reanimated: 4.7.0
  react-native-safe-area-context: ~5.9.1
  react-native-screens: ~4.28.0
  react-native-worklets: 0.13.0
  # Required (non-optional) peer of react-native-worklets; declared so pnpm
  # does not auto-install npm `latest` (0.87.x) against RN 0.88.
  "@react-native/metro-config": 0.88.0-rc.3
  "@react-navigation/native": 7.5.0
  solito: 5.0.0
  lucide-react: 1.51.0
  lucide-react-native: 1.51.0
  react-native-svg: 15.15.5
  react-native-pulsar: 1.7.0
  "@expo/html-elements": 58.0.3
  "@expo/ui": 58.0.12
  expo-paste-input: 0.2.2
  expo-drag-drop-content-view: 0.9.2

  # universal GPU graphics
  # Skia v3 (Graphite by default; Android minSdk 26+). One package under two
  # names: react-native-graph imports @shopify/react-native-skia, our code
  # imports react-native-skia, and both resolve to the same 3.0.2 install.
  react-native-skia: 3.0.2
  "@shopify/react-native-skia": npm:react-native-skia@3.0.2
  react-native-graph: 1.4.0
  canvaskit-wasm: 0.41.0
  react-native-webgpu: 0.10.4
  typegpu: 0.12.6
  # three.js on its WebGPU renderer (WebGL2 backend as the web fallback),
  # with TypeGPU functions bridged into TSL by @typegpu/three.
  three: 0.186.1
  "@typegpu/three": 0.12.1
  "@typegpu/gl": 0.12.5

  # spatial / XR / Rive
  "@reactvision/react-viro": github:mikevocalz/viro#5393d00744f448fc462ef13ee76b1346fc47512e
  "@reactvision/viro-web-renderer": 1.0.1
  "@metavr/layout-compat": 1.0.0
  "@metavr/layout-window-compat": 1.0.0
  "@rive-app/react-native": 0.5.2
  "@rive-app/react-webgl2": 4.36.0

  # web
  "@next/env": 16.3.8
  next: 16.3.8
  nextjs-toploader: 3.9.17

  # styling
  uniwind: 1.12.1
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  react-native-css: 3.0.7
  tailwind-merge: 3.7.0
  tailwind-variants: 3.3.1

  # state / data
  "@tanstack/react-query": 5.104.1
  "@tanstack/react-virtual": 3.14.13
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-pacer": 0.24.0
  "@tanstack/react-table": 9.2.4
  "@legendapp/list": 3.6.0
  "@legendapp/motion": 2.5.3
  date-fns: 4.4.0
  zustand: 5.0.15
  zod: 4.6.5

  # auth (ADR 0001; DECISIONS #2, #3)
  # @delmaredigital/payload-better-auth comes from the mikevocalz fork until
  # upstream ships Payload 4 support (PR delmaredigital/payload-better-auth#43).
  # The pin is the fork's payload-4-dist branch: the PR commit plus its built
  # dist/, because pnpm does not build git dependencies that only declare
  # prepublishOnly. Bump this together with the PR branch.
  "@delmaredigital/payload-better-auth": github:mikevocalz/payload-better-auth#3eb634b9f8ecff60f649864f75cdd7ea7afeea27
  better-auth: 1.7.7
  "@better-auth/passkey": 1.7.7
  resend: 6.32.0

  # backend / cms
  payload: 4.0.0-canary.37
  "@payloadcms/db-postgres": 4.0.0-canary.37
  "@payloadcms/next": 4.0.0-canary.37
  "@payloadcms/ui": 4.0.0-canary.37
  graphql: 16.14.2
  pg: 8.23.1
  sharp: 0.35.5
  "@types/pg": 8.23.1

  # storybook / vite
  storybook: 10.6.1
  "@storybook/react-vite": 10.6.1
  "@storybook/addon-a11y": 10.6.1
  "@vitejs/plugin-react": ^6.1.1
  vite: ^8.3.2
  vite-plugin-react-native-web: ^3.2.0
  sonner: 2.0.8
  sonner-native: 0.27.0

  # tooling
  typescript: ~6.0.3
  "@types/react": ~19.3.0
  "@types/node": ^26.6.4
  "@types/react-dom": ^19.3.0
  "@webgpu/types": 0.1.74
  "@types/three": 0.186.0
  unplugin-typegpu: 0.12.4
  eslint: ^9.39.5
  eslint-config-expo: ~58.0.4
  eslint-config-next: 16.3.8
  "@eslint/eslintrc": ^3.3.7
  babel-plugin-react-compiler: 1.0.0
  turbo: 2.11.7
  vitest: 5.0.3

patchedDependencies:
  react-native-graph@1.4.0: patches/react-native-graph@1.4.0.patch
  # Backports uniwind PR #706: the web resolver no longer cycles through
  # InputAccessoryView, which left `expo start --web` blank. Remove once
  # uniwind releases #706 (uni-stack/uniwind#704).
  uniwind@1.12.1: patches/uniwind@1.12.1.patch
