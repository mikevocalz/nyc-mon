<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP App sandbox</title>
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<script>
// MCP Apps sandbox proxy (spec 2026-01-26, "Sandbox proxy"). This document is
// served on its own origin with the view's CSP as an HTTP header. It builds an
// inner iframe for the view's HTML, which inherits that CSP, and relays
// JSON-RPC between the simulator page and the view. Messages named
// ui/notifications/sandbox-* stop here.
(function () {
  'use strict';
  var HOST_ORIGIN = '__HOST_ORIGIN__';
  var OWN_ORIGIN = window.location.origin;
  if (window.self === window.top) throw new Error('The sandbox only runs inside the simulator.');

  // The proxy must not be able to reach the host page. If it can, stop.
  var escaped = false;
  try { void window.top.document; escaped = true; } catch (e) { /* expected: cross-origin */ }
  if (escaped) throw new Error('Sandbox isolation is broken; refusing to load the view.');

  var inner = document.createElement('iframe');
  inner.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
  inner.setAttribute('title', 'Mon view');
  document.body.appendChild(inner);

  var PERMISSION_FEATURES = { camera: 'camera', microphone: 'microphone', geolocation: 'geolocation', clipboardWrite: 'clipboard-write' };

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (event.source === window.parent) {
      if (event.origin !== HOST_ORIGIN) return;
      if (data && data.method === 'ui/notifications/sandbox-resource-ready') {
        var p = data.params || {};
        if (typeof p.sandbox === 'string') inner.setAttribute('sandbox', p.sandbox);
        if (p.permissions && typeof p.permissions === 'object') {
          var allow = Object.keys(PERMISSION_FEATURES).filter(function (k) { return p.permissions[k]; }).map(function (k) { return PERMISSION_FEATURES[k]; });
          if (allow.length) inner.setAttribute('allow', allow.join('; '));
        }
        if (typeof p.html === 'string') {
          var doc = inner.contentDocument;
          if (doc) { doc.open(); doc.write(p.html); doc.close(); } else { inner.srcdoc = p.html; }
        }
        return;
      }
      if (data && typeof data.method === 'string' && data.method.indexOf('ui/notifications/sandbox-') === 0) return;
      if (inner.contentWindow) inner.contentWindow.postMessage(data, OWN_ORIGIN);
    } else if (event.source === inner.contentWindow) {
      if (event.origin !== OWN_ORIGIN) return;
      window.parent.postMessage(data, HOST_ORIGIN);
    }
  });

  window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/sandbox-proxy-ready', params: {} }, HOST_ORIGIN);
})();
</script>
</body>
</html>
