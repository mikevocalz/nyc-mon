name: Regenerate SDK 58 UI lockfile on dropdown feature branch

on:
  push:
    branches:
      - feat/ui-material3-expressive-dropdowns-2026-11-04
    paths:
      - pnpm-workspace.yaml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'mikevocalz/nyc-mon'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Regenerate using real package metadata (never hand-edit integrity)
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile on feature branch, not main
        env:
          BRANCH: feat/ui-material3-expressive-dropdowns-2026-11-04
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git commit -m "chore(lockfile): resolve Expo UI 58.0.27 for native dropdowns"
          git push origin "HEAD:$BRANCH"
