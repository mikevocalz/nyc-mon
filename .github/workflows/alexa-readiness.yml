name: Alexa offline contracts
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'skills/nyc-mon-companion/**'
      - 'tooling/alexa-readiness/**'
      - '.github/workflows/alexa-readiness.yml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: install
        run: pnpm install --frozen-lockfile
      - id: validator
        run: python -m pip install --disable-pip-version-check -r tooling/alexa-readiness/requirements.txt
      - id: browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Record offline evidence
        if: always()
        env:
          READINESS_BOOTSTRAP_STATUS: ${{ steps.install.outcome == 'success' && steps.validator.outcome == 'success' && steps.browser.outcome == 'success' && 'success' || 'failed' }}
          READINESS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node tooling/alexa-readiness/run.mjs
      - name: Upload evidence, including incomplete checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alexa-offline-evidence-${{ github.sha }}
          path: .alexa-readiness/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
