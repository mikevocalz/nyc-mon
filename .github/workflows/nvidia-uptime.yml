name: NVIDIA judge stack uptime

# Probes the hosted judge stack every 30 minutes through the judging period
# (until 2026-12-15). A failed probe opens an issue, or comments on the open one.
# Scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nvidia-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stop after the judging period
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261215 ]; then echo "active=false" >> "$GITHUB_OUTPUT"; else echo "active=true" >> "$GITHUB_OUTPUT"; fi
      - name: Probe health endpoints
        id: probe
        if: steps.window.outputs.active == 'true'
        run: |
          # The backend has no /healthz route; its RFC 8414 metadata needs no database and no session.
          targets="
          https://nyc-mon-companion.onrender.com/healthz
          https://nyc-mon-mcp.onrender.com/healthz
          https://nyc-mon-backend-staging.vercel.app/.well-known/oauth-authorization-server
          "
          failed=""
          for url in $targets; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 15 --retry-all-errors "$url" || echo 000)
            echo "$url -> $code" | tee -a "$RUNNER_TEMP/report.txt"
            [ "$code" = "200" ] || failed="$failed $url($code)"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ]
      - name: Open or update the outage issue
        if: failure() && steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="NVIDIA judge stack health check failing"
          body="$(cat "$RUNNER_TEMP/report.txt")

          Run: $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
