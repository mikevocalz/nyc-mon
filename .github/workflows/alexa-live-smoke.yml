name: Alexa live smoke
# Manual only: real Bedrock spend and the deployed services. Secrets live in the
# protected `alexa-live` environment; without them every check reports NOT RUN
# and the job fails. It never falls back to the mock.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: alexa-live
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @acme/web-sim...
      - name: Assume the Bedrock role
        if: ${{ vars.AWS_BEDROCK_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Live smoke
        working-directory: packages/web-sim
        env:
          LIVE_MCP_URL: ${{ vars.LIVE_MCP_URL }}
          AUTH_ISSUER: ${{ vars.AUTH_ISSUER }}
          LIVE_MON_ID: ${{ vars.LIVE_MON_ID }}
          LIVE_ACCESS_TOKEN: ${{ secrets.LIVE_ACCESS_TOKEN }}
          SIM_BEDROCK_MODEL_ID: ${{ vars.SIM_BEDROCK_MODEL_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: node scripts/live-smoke.ts
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alexa-live-evidence-${{ github.sha }}
          path: packages/web-sim/.alexa-readiness/live.json
          if-no-files-found: error
          retention-days: 30
