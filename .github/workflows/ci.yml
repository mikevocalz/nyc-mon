name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node floor (RN 0.87 requires >= 22.13.0).
          # Bump .nvmrc and the root package.json "engines" together.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # packages/theme's scheme-scope test renders in headless Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter web --filter @acme/ui --filter @acme/theme --filter @acme/mcp-server --filter @acme/web-sim --filter @acme/payload --filter @acme/app test
      # android/ is generated (CNG); build it before checking the XR contract.
      - run: pnpm --filter mobile exec expo prebuild --platform android --no-install
      - run: pnpm spatial:verify-android
      - run: pnpm spatial:verify-typegpu
      - run: pnpm turbo build typecheck lint
      - name: Verify City atlas responsive layout
        timeout-minutes: 5
        run: |
          (
            cd apps/web
            exec node "$(node -p "require.resolve('next/dist/bin/next')")" start -p 3611 --hostname 127.0.0.1
          ) &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for i in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo '::error::City layout server exited before readiness'
              exit 1
            fi
            if curl -sf --max-time 2 http://127.0.0.1:3611/city > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo '::error::City layout server did not become ready'
            exit 1
          fi
          BASE=http://127.0.0.1:3611 BASE_PATH='' node tooling/site-qa/city-layout.mjs
