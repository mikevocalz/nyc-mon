name: NYC-Mon Duo frame probe
on:
  pull_request:
    paths:
      - 'packages/app/features/game/perf/**'
      - 'packages/app/features/game/GameScreen.tsx'
      - 'packages/ui/three/ThreeCanvas.tsx'
      - 'packages/ui/three/types.ts'
      - 'docs/performance/nycmon-duo-frame-probe-2026-10-16.md'
      - '.github/workflows/nycmon-duo-frame-probe.yml'
permissions:
  contents: read
jobs:
  probe-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test packages/app/features/game/perf/frame-sampler.test.ts
