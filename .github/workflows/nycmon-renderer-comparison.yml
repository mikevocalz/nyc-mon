name: NYC-Mon engine comparison integrity
on:
  pull_request:
    paths:
      - 'tooling/renderer-bench/**'
      - 'docs/performance/pixijs3d-vs-three-2026-10-16.md'
      - '.github/workflows/nycmon-renderer-comparison.yml'
permissions:
  contents: read
jobs:
  fair-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tooling/renderer-bench/compare.test.ts
