name: Apply verified website editor completion
on:
  push:
    branches: [feat/payload-site-editor]
    paths: ['.github/workflows/site-editor-apply-verified.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'mikevocalz/nyc-mon' && github.ref == 'refs/heads/feat/payload-site-editor'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verify source base and immutable patch
        run: |
          test "$(git rev-parse HEAD^)" = '73202a12295707598fc66ca83008f49cbe0f86f6'
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 'https://sb-x8nlsgmzffb2.vercel.run/completion.patch.gz' -o /tmp/editor.patch.gz
          echo 'af0c6abb51ec3080be2f8e78d1ddb513a8b88ef93d741ca9c118b17e87a70574  /tmp/editor.patch.gz' | sha256sum -c -
          gzip -dc /tmp/editor.patch.gz > /tmp/editor.patch
          echo 'dfb0e19600b0032b0a211eb8f6c875ddad4a83643fe80c06e00e2d65677bb1ff  /tmp/editor.patch' | sha256sum -c -
          git apply --check /tmp/editor.patch
          git apply --index /tmp/editor.patch
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          for path in filter(None, paths):
              assert path.startswith(('apps/', 'packages/', 'docs/', 'tooling/site-editor/')), path
              assert not any(s in path for s in ['.env', 'node_modules', '/.next', '/.vercel', 'auth-fixtures.json', 'admin-state.json']), path
          for line in subprocess.check_output(['git', 'diff', '--cached', '--raw']).decode().splitlines():
              assert '120000' not in line, 'Symlink changes are not allowed'
          PY
          git diff --cached --check
      - name: Commit source without executing it
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(cms): finish full-site editing, signed preview, migration and verified publishing' -m 'Preserve the existing Payload/Better Auth/Neon/Bunny stack. Complete all marketing pages and shared chrome, draft-safe media, source import, native editing and caller identity. Full typechecks, production builds, regression tests and isolated browser/API verification recorded in docs/cms/VERIFICATION.md. Production remains disabled pending controlled rollout.'
          git push origin HEAD:refs/heads/feat/payload-site-editor
      - name: Retain sanitized verification evidence
        run: |
          mkdir -p evidence
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 60 'https://sb-x8nlsgmzffb2.vercel.run/verified-evidence.zip' -o evidence/verified-evidence.zip
          echo '43af137dda1646a650a745407d11bb2f3a27f98ccb109c10815daadfc2850acf  evidence/verified-evidence.zip' | sha256sum -c -
          git rev-parse HEAD > evidence/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: website-editor-completion-evidence
          path: evidence/
          retention-days: 7
